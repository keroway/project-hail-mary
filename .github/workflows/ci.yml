name: CI — Lint, Typecheck, Build & Preview Deploy

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; deploy-preview overrides at job level.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Biome lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run astro check
        run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Skip `astro check` here — the `typecheck` job covers it.
      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: E2E Smoke Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-preview:
    name: Preview Deploy
    needs: [build]
    # Dependabot / fork からの PR には Actions secrets が渡らないため
    # （CLOUDFLARE_API_TOKEN が空になり wrangler が起動できない）スキップする。
    # Preview Deploy は必須チェックではないのでマージはブロックされない。
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # wrangler-action は shell を介さず exec するため command 内の $VAR は
      # 展開されない（従来 --branch=$BRANCH_NAME が literal 扱いされ、全 PR が
      # branch-name.<project>.pages.dev という同一エイリアスを共有していた）。
      # ブランチ名は untrusted 入力なので、command に埋める前に許可文字だけに絞る。
      - name: Sanitize branch name
        id: branch
        env:
          RAW_BRANCH: ${{ github.head_ref }}
        run: |
          name=$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9._/-' '-')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Deploy Preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=project-hail-mary --branch=${{ steps.branch.outputs.name }}

      - name: Comment Preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## プレビュー URL

            ${{ steps.deploy.outputs.deployment-url }}

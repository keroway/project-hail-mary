name: CI — Lint, Typecheck, Build & Preview Deploy

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; deploy-preview overrides at job level.
permissions:
  contents: read

jobs:
  # コード（src/**, astro.config.*, package.json 等）に影響する変更かどうかを判定する。
  # README.md / CLAUDE.md など「コードとみなすパス」に含まれないファイルのみの変更では
  # 下流の Lint / Typecheck / Build / E2E / Preview Deploy を job 単位の `if:` でスキップする。
  # ワークフロー自体は pull_request で必ず起動させ、スキップした job も success/skipped で
  # 完了させることで、ブランチ保護の必須チェックが pending のまま止まらないようにする。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - 'src/**'
              - 'public/**'
              - 'astro.config.*'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'biome.json'
              - 'biome.jsonc'
              - 'playwright.config.*'
              # tests/** が無いと、テストだけを変更した PR で E2E も typecheck も
              # skip され、壊れた spec がそのままマージされうる（PR #164 で実際に skip された）。
              - 'tests/**'
              - 'vitest.config.*'
              - '_typos.toml'
              - '.github/workflows/**'
              - 'justfile'
              - 'lefthook.yml'
              - 'mise.toml'

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm run lint

      - name: Run typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      - name: Run unit tests
        run: pnpm run test:unit

  typecheck:
    name: Typecheck
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run astro check
        run: pnpm run check

  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Skip `astro check` here — the `typecheck` job covers it.
      - name: Build
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: E2E Smoke Tests
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-preview:
    name: Preview Deploy
    needs: [changes, build]
    # Dependabot / fork からの PR には Actions secrets が渡らないため
    # （CLOUDFLARE_API_TOKEN が空になり wrangler が起動できない）スキップする。
    # ドキュメントのみの変更（needs.changes.outputs.code == 'false'）でも build と同様に
    # スキップする。Preview Deploy は必須チェックではないのでマージはブロックされない。
    if: >-
      needs.changes.outputs.code == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # wrangler-action がバンドル同梱の Wrangler の代わりにプロジェクトの package
      # manager を検出して呼び出そうとするため、dist を使うだけのジョブでも pnpm を
      # PATH 上に用意しておく必要がある。
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      # wrangler-action は shell を介さず exec するため command 内の $VAR は
      # 展開されない（従来 --branch=$BRANCH_NAME が literal 扱いされ、全 PR が
      # branch-name.<project>.pages.dev という同一エイリアスを共有していた）。
      # ブランチ名は untrusted 入力なので、command に埋める前に許可文字だけに絞る。
      - name: Sanitize branch name
        id: branch
        env:
          RAW_BRANCH: ${{ github.head_ref }}
        run: |
          name=$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9._/-' '-')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Deploy Preview
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=project-hail-mary --branch=${{ steps.branch.outputs.name }}

      - name: Comment Preview URL
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          message: |
            ## プレビュー URL

            ${{ steps.deploy.outputs.deployment-url }}

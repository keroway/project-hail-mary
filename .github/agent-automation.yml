# Claude Code の issue-sprint / issue-refinement スキルが参照する
# エージェント自動化のブートストラップ設定。
#
# - enabled: この機能フラグが true の場合のみ、上記スキルは Issue に対する
#   ラベル付け・assign・ブランチ作成・PR 作成などの delivery 操作を許可する。
# - max_issues_per_cycle: 1 サイクルで処理してよい Issue 数の上限。
#   issue-sprint は必ずこの値以下（実質的に高々1件）しか処理しない。
# - allow_merge: true かつ呼び出し側が明示的にマージを要求した場合のみ、
#   CI green・レビュー解決・ブランチ保護要件を満たした PR を squash merge してよい。
#   false の間は、issue-sprint は PR を作成した時点で止まり、
#   マージは owner が通常の権限で行う（.claude/CLAUDE.md の運用方針に合わせる）。
enabled: true
max_issues_per_cycle: 1
allow_merge: true

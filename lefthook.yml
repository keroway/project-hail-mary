# keroway 標準 lefthook 設定（JS/TS リポジトリ向けテンプレート適用）。
# https://lefthook.dev/configuration/
# Template: keroway/.github/templates/lefthook.yml
#
# npm 管理のため `pnpm exec` は `npx` に置き換え。
# pre-push は Playwright e2e（`npm run test:e2e`）を含めず `npm run build` のみ。
# e2e はブラウザインストールが必要で重く、PR の必須 CI（E2E Smoke Tests）で
# 既にカバーされているため、pre-push ではビルド可否のみを軽量に検証する。

pre-commit:
  parallel: true
  jobs:
    - name: biome check (staged files)
      glob: "*.{ts,js,mjs,astro,json}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: "*.astro"
      run: npx astro check

pre-push:
  jobs:
    - name: build
      run: npm run build
